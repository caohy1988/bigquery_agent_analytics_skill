<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Analytics</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1.45;
      }
      .viz-root {
        color-scheme: light;
        --surface-1: #fcfcfb;
        --page: #f9f9f7;
        --ink: #0b0b0b;
        --ink-2: #52514e;
        --muted: #898781;
        --grid: #e1e0d9;
        --axis: #c3c2b7;
        --border: rgba(11, 11, 11, 0.1);
        --s1: #2a78d6; /* categorical slot 1 — blue   */
        --s2: #eb6834; /* categorical slot 2 — orange */
        --s3: #1baf7a; /* categorical slot 3 — aqua   */
        --s8: #e34948; /* categorical slot 8 — red    */
        --good-text: #006300;
        min-height: 100vh;
        background: var(--page);
        color: var(--ink);
        padding: 14px 16px 24px;
      }
      @media (prefers-color-scheme: dark) {
        :root:where(:not([data-theme="light"])) .viz-root {
          color-scheme: dark;
          --surface-1: #1a1a19;
          --page: #0d0d0d;
          --ink: #ffffff;
          --ink-2: #c3c2b7;
          --muted: #898781;
          --grid: #2c2c2a;
          --axis: #383835;
          --border: rgba(255, 255, 255, 0.1);
          --s1: #3987e5;
          --s2: #d95926;
          --s3: #199e70;
          --s8: #e66767;
          --good-text: #0ca30c;
        }
      }
      :root[data-theme="dark"] .viz-root {
        color-scheme: dark;
        --surface-1: #1a1a19;
        --page: #0d0d0d;
        --ink: #ffffff;
        --ink-2: #c3c2b7;
        --muted: #898781;
        --grid: #2c2c2a;
        --axis: #383835;
        --border: rgba(255, 255, 255, 0.1);
        --s1: #3987e5;
        --s2: #d95926;
        --s3: #199e70;
        --s8: #e66767;
        --good-text: #0ca30c;
      }

      header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
      .titlebar { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
      .titlebar h1 { font-size: 16px; font-weight: 600; }
      .scope-note { color: var(--muted); font-size: 12px; }

      .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .filters select {
        font: inherit;
        color: var(--ink);
        background: var(--surface-1);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 5px 8px;
      }
      .status-note { color: var(--muted); font-size: 12px; }
      .status-note.error { color: #d03b3b; }

      .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--grid); }
      .tabs button {
        font: inherit;
        font-weight: 500;
        color: var(--ink-2);
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        padding: 6px 10px;
        cursor: pointer;
      }
      .tabs button:hover { color: var(--ink); }
      .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

      main { display: flex; flex-direction: column; gap: 12px; transition: opacity 0.15s; }
      main.loading { opacity: 0.55; pointer-events: none; }

      .tile-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
      .card {
        background: var(--surface-1);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .card h2 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
      .card .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }

      .tile .label { color: var(--ink-2); font-size: 12px; }
      .tile .value { font-size: 24px; font-weight: 600; margin-top: 2px; }
      .tile .detail { color: var(--muted); font-size: 11px; margin-top: 2px; }

      .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 2px 0 6px; }
      .legend .item { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; }
      .legend .key-line { width: 14px; height: 2px; border-radius: 1px; }
      .legend .key-rect { width: 10px; height: 10px; border-radius: 2px; }

      svg { display: block; }
      svg text { font-family: inherit; font-size: 11px; fill: var(--muted); }
      .gridline { stroke: var(--grid); stroke-width: 1; }
      .baseline { stroke: var(--axis); stroke-width: 1; }
      .crosshair { stroke: var(--axis); stroke-width: 1; }
      .hit-col:focus, .hit-overlay:focus { outline: none; }
      .hit-col:focus-visible rect.focus-ring, .hit-overlay:focus-visible { outline: 2px solid var(--s1); }

      .hbar-rows { display: flex; flex-direction: column; gap: 7px; }
      .hbar-row { display: grid; grid-template-columns: minmax(90px, 180px) 1fr max-content; align-items: center; gap: 10px; }
      .hbar-label { color: var(--ink-2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hbar-track { display: flex; align-items: center; height: 14px; gap: 2px; }
      .hbar-seg { height: 14px; }
      .hbar-seg.end { border-radius: 0 4px 4px 0; }
      .hbar-seg.start { border-radius: 0; }
      .hbar-value { font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }
      .hbar-row:hover .hbar-label, .hbar-row:focus-within .hbar-label { color: var(--ink); }

      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th { text-align: right; color: var(--muted); font-weight: 500; padding: 5px 8px; border-bottom: 1px solid var(--grid); }
      td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; color: var(--ink); }
      th:first-child, td:first-child { text-align: left; font-variant-numeric: normal; }
      td:first-child { color: var(--ink-2); }
      tr:last-child td { border-bottom: none; }
      .table-scroll { overflow-x: auto; }

      .tooltip {
        position: fixed;
        z-index: 10;
        background: var(--surface-1);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.14);
        padding: 8px 10px;
        pointer-events: none;
        font-size: 12px;
        min-width: 130px;
      }
      .tooltip .tt-title { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
      .tooltip .tt-row { display: flex; align-items: center; gap: 7px; margin-top: 2px; }
      .tooltip .tt-key { width: 12px; height: 2px; border-radius: 1px; flex: none; }
      .tooltip .tt-val { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
      .tooltip .tt-name { color: var(--ink-2); }

      .empty { color: var(--muted); padding: 18px 0; text-align: center; }
    </style>
  </head>
  <body>
    <div class="viz-root">
      <header>
        <div class="titlebar">
          <h1>Agent analytics</h1>
          <span class="scope-note" id="scope-note">Loading…</span>
        </div>
        <div class="filters" role="toolbar" aria-label="Dashboard filters">
          <select id="f-range" aria-label="Time range">
            <option value="24">Last 24 hours</option>
            <option value="72">Last 3 days</option>
            <option value="168" selected>Last 7 days</option>
            <option value="720">Last 30 days</option>
            <option value="2160">Last 90 days</option>
          </select>
          <select id="f-agent" aria-label="Agent">
            <option value="">All agents</option>
          </select>
          <span class="status-note" id="status-note"></span>
        </div>
        <nav class="tabs" role="tablist" aria-label="Dashboard views" id="tabs"></nav>
      </header>
      <main id="view" aria-live="polite"></main>
      <div class="tooltip" id="tooltip" hidden></div>
    </div>
    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
